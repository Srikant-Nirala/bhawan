/* ================================================================
   MODERN UI LAYER (v2) — visual refresh only. No markup / logic changes.
   Loaded last so it overrides the base styles above.
   ================================================================ */
:root{
  --bg:#f4f5fb;--c:#ffffff;--t:#0f1222;--m:#7b8194;--b:#e8eaf3;
  --p:#4361ee;--p2:#6d5df6;--g:#22b36b;--r:#f04458;--o:#f59e0b;
  --rad:22px;--rad-s:14px;
  --sh:0 1px 2px rgba(15,18,34,.04),0 8px 24px -8px rgba(40,50,110,.12);
  --sh-lg:0 2px 4px rgba(15,18,34,.05),0 18px 40px -12px rgba(40,50,110,.22);
  --grad:linear-gradient(135deg,#4361ee 0%,#6d5df6 100%);
  --ring:0 0 0 4px rgba(67,97,238,.16);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI","Noto Sans Devanagari","Helvetica Neue",Arial,sans-serif;
}
html[data-theme=dark]{
  --bg:#0a0c12;--c:#14171f;--t:#eef0f7;--m:#8b91a5;--b:#232733;
  --p:#6b8cff;--p2:#8b7bff;--sh:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px -10px rgba(0,0,0,.6);
  --sh-lg:0 18px 40px -12px rgba(0,0,0,.7);
  --grad:linear-gradient(135deg,#4f6df0 0%,#7a6af5 100%);
  --ring:0 0 0 4px rgba(107,140,255,.22);
}
body{font-size:16.5px;letter-spacing:-.015em;background:var(--bg)}
html{background:var(--bg)}
::-webkit-scrollbar{display:none}
#main{max-width:600px;padding-left:18px;padding-right:18px}

/* ---- headings ---- */
h2{font-size:30px;font-weight:800;letter-spacing:-.04em}
h3{font-size:12px;font-weight:800;letter-spacing:.09em;color:var(--m);margin:26px 8px 10px}
.ph{background:none;padding:0;border-radius:0;margin:26px 8px 8px;font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--m);display:flex;align-items:center;gap:10px}
.ph::after{content:"";flex:1;height:1px;background:var(--b)}

/* ---- cards ---- */
.card{border-radius:var(--rad);border:1px solid var(--b);box-shadow:var(--sh);background:var(--c)}
html[data-theme=dark] .card{border-color:rgba(255,255,255,.05)}
.card.clk{box-shadow:var(--sh);transition:transform .18s cubic-bezier(.3,.7,.4,1),box-shadow .2s,border-color .2s}
.card.clk:active{transform:scale(.985)}
.card.cp.ex{box-shadow:var(--sh-lg);border-color:color-mix(in srgb,var(--p) 40%,var(--b))}
.card.ot{background:linear-gradient(135deg,rgba(245,158,11,.14),rgba(245,158,11,.06));border:1px solid rgba(245,158,11,.28);color:#b45309;box-shadow:none}
html[data-theme=dark] .card.ot{background:linear-gradient(135deg,rgba(245,158,11,.18),rgba(245,158,11,.07));color:#fbbf24;border-color:rgba(245,158,11,.3)}
.cv{background:color-mix(in srgb,var(--p) 10%,transparent);color:var(--p)}

/* ---- tiles ---- */
.tile{border-radius:20px;border:1px solid var(--b);box-shadow:var(--sh);padding:15px 16px;gap:15px;transition:transform .16s cubic-bezier(.3,.7,.4,1),box-shadow .2s}
html[data-theme=dark] .tile{border-color:rgba(255,255,255,.05)}
.tile:active{transform:scale(.98);opacity:1}
.tile .tx b{font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.tile small{font-size:13px;color:var(--m);font-weight:500}
.tile .ch{color:var(--m);opacity:.5;font-size:24px;font-weight:300}
.ic{border-radius:14px;width:46px;height:46px;font-size:21px;box-shadow:0 6px 14px -6px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.av{width:44px;height:44px;background:#2c588a;box-shadow:0 6px 14px -6px rgba(44,88,138,.6),inset 0 1px 0 rgba(255,255,255,.3);font-weight:700}
.duo{gap:12px}
.duo .tile{border-radius:22px;min-height:116px;font-weight:700;font-size:15.5px}
.duo .tile .ic{width:50px;height:50px;border-radius:16px}
.nm{font-weight:700;letter-spacing:-.02em}

/* ---- HERO tile on home ---- */
.quad.one{background:
  radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.20) 0%,transparent 55%),
  radial-gradient(90% 80% at 100% 100%,rgba(10,26,52,.28) 0%,transparent 62%),
  linear-gradient(135deg,#346496 0%,#2c588a 52%,#244879 100%);
  border-radius:18px;box-shadow:0 8px 18px -12px rgba(44,88,138,.4),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 6px rgba(8,20,44,.22);margin:10px 0 14px}
html[data-theme=dark] .quad.one{background:
  radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.12) 0%,transparent 55%),
  radial-gradient(90% 80% at 100% 100%,rgba(6,18,38,.32) 0%,transparent 62%),
  linear-gradient(135deg,#305f8b 0%,#25496f 55%,#1d3c5e 100%);
  box-shadow:0 8px 18px -12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.15),inset 0 -2px 6px rgba(0,0,0,.25)}
.quad.one::before{background:linear-gradient(180deg,rgba(255,255,255,.12),transparent);border-radius:18px 18px 0 0;height:40%}
.quad.one>div{transition:background .15s}
.quad.one>div:active{background:rgba(255,255,255,.12)}
.quad.one>div:nth-child(odd){border-right-color:rgba(255,255,255,.2)}

.quad.one>#Tile1 span,.quad.one>#Tile2 span{font-size:14.5px!important;font-weight:600!important;opacity:.9;letter-spacing:0}
.quad b,.quad.one b{font-size:30px;font-weight:800;letter-spacing:-.045em}
.quad.one>#Tile8 b{font-size:15px}

/* ---- status strip (thin tile) ---- */
.slim,.slim.ok{background:rgba(34,179,107,.13)!important;color:#0f7a48!important;border:1px solid rgba(34,179,107,.28);box-shadow:none;border-radius:16px;padding:12px 16px;min-height:48px;margin-bottom:26px}
.slim span,.slim.ok span{color:#0f7a48!important;font-weight:700!important}
#Tile3s[data-al="1"]{background:rgba(245,158,11,.14)!important;border-color:rgba(245,158,11,.35)}
#Tile3s[data-al="1"],#Tile3s[data-al="1"] span{color:#a45a06!important}
html[data-theme=dark] .slim,html[data-theme=dark] .slim.ok{background:rgba(52,211,130,.12)!important;border-color:rgba(52,211,130,.25)}
html[data-theme=dark] .slim span,html[data-theme=dark] .slim.ok span{color:#4ade9a!important}
html[data-theme=dark] #Tile3s[data-al="1"]{background:rgba(245,158,11,.14)!important;border-color:rgba(245,158,11,.3)}
html[data-theme=dark] #Tile3s[data-al="1"],html[data-theme=dark] #Tile3s[data-al="1"] span{color:#fbbf24!important}
#Tile3s{border-radius:16px;min-height:48px;margin:0 2.5px 20px} /* 5px narrower than full width */
.slim.two{padding:0;background:var(--c)!important;border:1px solid var(--b);box-shadow:var(--sh)}
.slim.two>div{color:var(--t)!important;padding:14px 8px;font-weight:700!important;font-size:14.5px!important}
.slim.two>i{background:var(--b)}
html[data-theme=dark] .slim.two{background:var(--c)!important;border-color:rgba(255,255,255,.05)}
html[data-theme=dark] .slim.two>div{color:var(--t)!important}

/* ---- buttons ---- */
.btn{border-radius:16px;background:var(--grad);padding:16px;font-size:16.5px;font-weight:700;letter-spacing:-.01em;box-shadow:0 10px 22px -10px rgba(67,97,238,.7),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .14s,opacity .15s,box-shadow .2s}
.btn:active{transform:scale(.97);opacity:.92}
.btn.o{background:color-mix(in srgb,var(--p) 11%,transparent);color:var(--p);box-shadow:none}
.btn.r{background:rgba(240,68,88,.12);color:var(--r);box-shadow:none}
.btn.r.dbtn{background:rgba(240,68,88,.14);color:#d62839;box-shadow:none}
html[data-theme=dark] .btn.r.dbtn{background:rgba(240,68,88,.2);color:#ff7a8a}
.btn.lbtn,.btn.gbtn{box-shadow:none;border-radius:16px}
.btn.lbtn{background:color-mix(in srgb,var(--p) 12%,transparent);color:var(--p)}
.btn.gbtn{background:rgba(34,179,107,.15);color:#0f7a48}
html[data-theme=dark] .btn.gbtn{background:rgba(52,211,130,.16);color:#4ade9a}
.btn[style*="25d366"]{background:linear-gradient(135deg,#25d366,#1fb855)!important;box-shadow:0 10px 22px -10px rgba(37,211,102,.7)}

/* ---- badges / chips ---- */
.badge{border-radius:99px;padding:5px 12px;font-weight:700;font-size:12px;background:rgba(240,68,88,.12);color:var(--r)}
.badge.paid{background:rgba(34,179,107,.14);color:#0f7a48}
.badge.org{background:rgba(245,158,11,.16);color:#a45a06}
html[data-theme=dark] .badge.paid{color:#4ade9a}
html[data-theme=dark] .badge.org{color:#fbbf24}
.chip{border-radius:99px}

/* ---- inputs ---- */
label{font-size:12.5px;font-weight:600;color:var(--m);margin:4px 4px 0;letter-spacing:0}
input,select{border-radius:var(--rad-s);background:color-mix(in srgb,var(--m) 9%,var(--c));border:1.5px solid var(--b);padding:14px 15px;font-size:16.5px;transition:border-color .15s,box-shadow .15s,background .15s}
html[data-theme=dark] input,html[data-theme=dark] select{background:#0e1118;border-color:#262b38}
input:focus,select:focus{border-color:var(--p);background:var(--c);box-shadow:var(--ring)}
html[data-theme=dark] input:focus,html[data-theme=dark] select:focus{background:#0e1118}
input.ok{border-color:var(--g)!important}
.tf label{opacity:1;font-weight:600;font-size:12.5px;color:var(--m)}
.sw{width:52px;height:31px;background:#d5d8e3}
html[data-theme=dark] .sw{background:#2a2f3d}
.sw.on{background:var(--g)}

/* ---- segmented control & month nav ---- */
.seg.big{background:color-mix(in srgb,var(--m) 14%,transparent);border-radius:16px;padding:4px}
.seg.big button{border-radius:12px;padding:11px 6px;font-size:14.5px;font-weight:700;transition:all .2s}
.seg.big button.on{box-shadow:0 4px 12px -4px rgba(67,97,238,.55)}
.mnav.tl{border-radius:20px;border:1px solid var(--b);box-shadow:var(--sh)}
.mnav.tl button{color:var(--p)}
.mnav.an button{color:var(--p)}

/* ---- list rows ---- */
.item{border-bottom:1px solid var(--b)}
.item[onclick]:active{background:color-mix(in srgb,var(--p) 8%,transparent)}
.m{color:var(--m)}
.pb{background:rgba(240,68,88,.2)}
.pb i{background:linear-gradient(90deg,#22b36b,#4ade9a)}

/* ---- bottom navigation: floating glass bar ---- */
nav{left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);border:1px solid var(--b);border-radius:26px;padding:6px;
  background:color-mix(in srgb,var(--c) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  box-shadow:0 14px 34px -10px rgba(30,40,100,.3);max-width:560px;margin:0 auto}
html[data-theme=dark] nav{border-color:rgba(255,255,255,.07);box-shadow:0 14px 34px -10px rgba(0,0,0,.8)}
nav .dv{display:none}
nav{grid-template-columns:1fr 1fr!important;gap:4px}
nav button{border-radius:20px;padding:8px 0 7px;font-size:11.5px;font-weight:600;transition:background .2s,color .2s,transform .12s}
nav .on{color:var(--p);background:color-mix(in srgb,var(--p) 12%,transparent)}

nav i{filter:none;opacity:.55}nav .on i{opacity:1}
nav i svg{display:block;margin:auto}
body:not(.nonav){padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* ---- circular profile + back buttons ---- */
@keyframes tgw{0%{box-shadow:0 0 0 0 transparent}18%,65%{border-color:color-mix(in srgb,currentColor 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,currentColor 35%,transparent),0 0 12px 2px color-mix(in srgb,currentColor 24%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
#Tile3s.gw{animation:tgw 2s ease-in-out 1}
/* after a fade/fwd page entry, '#main.fade>.slim' (more specific) kept overriding the glow; list both animations so the glow still plays */
#main.fade>#Tile3s.gw,#main.fwd>#Tile3s.gw{animation:rise .34s cubic-bezier(.3,.8,.4,1) .075s backwards,tgw 2s ease-in-out 1}
.pfb{width:44px;height:44px;top:10px;background:var(--c);border:1px solid var(--b);color:#2c588a;box-shadow:var(--sh)}
html[data-theme=dark] .pfb{background:var(--c);color:#6c9bd1}
.bkc{width:38px;height:38px;background:var(--c);border:1px solid var(--b);color:var(--p);box-shadow:var(--sh)}
.bkc.st{margin-bottom:10px}

analytics:()=>{const bs=db.bills.filter(b=>T(b.tenantId)),ps=db.payments.filter(x=>T(x.tenantId)),pm=x=>String(x.pdate).slice(0,7),ok=k=>/^\d{4}-\d{2}$/.test(k),
ks=[...bs.map(b=>b.month),...ps.map(pm)].filter(ok).sort();
if(!ks.length)return'<h2>Rent Analytics</h2><div class=card>No bills yet</div>';
const mo=curMonth(),end=ks[ks.length-1]>mo?ks[ks.length-1]:mo,nx=m=>{const[y,q]=m.split('-').map(Number),d=new Date(y,q,1);return d.getFullYear()+'-'+pd2(d.getMonth()+1)},rows=[];
for(let m=ks[0],n=0;m<=end&&n<240;m=nx(m),n++){
 const rec=r2(ps.filter(x=>pm(x)==m).reduce((q,x)=>q+N(x.amount),0)),
 pend=r2(bs.filter(b=>b.month==m).reduce((q,b)=>q+dueOf(b),0));
 rows.push({m,rec,pend})}
A.l=rows.map(r=>r.m);if(!A.l.includes(A.m))A.m=A.l.includes(mo)?mo:A.l[A.l.length-1];
const sel=rows.find(r=>r.m==A.m),i=A.l.indexOf(A.m),Hh=230,top=34,bot=38,ph=Hh-top-bot,mx=Math.max(1,sel.rec,sel.pend),
hh=v=>Math.max(v>0?4:0,Math.max(0,v)/mx*ph),bar=(x,v,c,tc,lb)=>`<rect x=${x} y=${top+ph-hh(v)} width=96 height=${hh(v)} rx=9 fill="${c}" /><text x=${x+48} y=${top+ph-hh(v)-9} text-anchor=middle font-size=16 font-weight=800 style="fill:${tc}">${R(v)}</text><text x=${x+48} y=${top+ph+24} text-anchor=middle font-size=13 font-weight=600 style="fill:var(--t)">${lb}</text>`;
return `<h2>Rent Analytics</h2><div class=card><div class="mnav an"><button onclick="shiftA(-1)" ${i<=0?'disabled':''}>‹</button><b>${mlabel(A.m)}</b><button onclick="shiftA(1)" ${i>=A.l.length-1?'disabled':''}>›</button></div>
<svg viewBox="0 0 320 ${Hh}" style="display:block;width:100%;height:auto;font-family:var(--f)"><line x1=0 x2=320 y1=${top+ph} y2=${top+ph} style="stroke:var(--b)" stroke-width=2 />${bar(30,sel.rec,'#30b858','#1b8a3d',mname(A.m)+' में मिला')}${bar(194,sel.pend,'#ff9500','#c76a00',mname(A.m)+' का बकाया')}</svg>

/* ================================================================
   4. MONEY & BILL HELPERS - own / paid / due, older dues, arrears, month names
   ================================================================ */
const wa=p=>{p=String(p).replace(/\D/g,'');return p.length==10?'91'+p:p};
const r2=x=>Math.round(N(x)*100)/100,own=b=>r2(Math.max(0,N(b.rent)+N(b.elec)-N(b.waived))),paidAmt=b=>b.status=='paid'?own(b):Math.min(own(b),r2(N(b.paid))),dueOf=b=>r2(Math.max(0,own(b)-paidAmt(b))),
tenantDue=id=>r2(db.bills.filter(b=>b.tenantId==id).reduce((q,b)=>q+dueOf(b),0)), /* everything this tenant still owes, across all months */

ML=m=>{const d=new Date(m+'-01T00:00');return d.toLocaleString('hi',{month:'long'})+'-'+d.getFullYear()},
olderDue=b=>db.bills.filter(x=>x.tenantId==b.tenantId&&x.id!=b.id&&x.month<b.month&&dueOf(x)>0).sort((a,c)=>a.month.localeCompare(c.month)),
arrears=(id,m)=>m?db.bills.filter(x=>x.tenantId==id&&x.month<m&&dueOf(x)>0).sort((a,c)=>a.month.localeCompare(c.month)).map(x=>[x.month,dueOf(x),x.type]):[];
const nextM=m=>{const[y,q]=m.split('-').map(Number),d=new Date(y,q,1);return d.getFullYear()+'-'+pd2(d.getMonth()+1)},
missingMonths=(t,m)=>{const bs=db.bills.filter(b=>b.tenantId==t.id&&String(b.month).length==7);if(!bs.length||String(m).length!=7)return[];
